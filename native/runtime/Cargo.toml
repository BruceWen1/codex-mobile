[package]
name = "codex-mobile-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "codex-mobile-exec-host"
path = "src/exec_host.rs"

[dependencies]
anyhow = "1"
codex-app-server = { path = "../../upstream/codex/codex-rs/app-server" }
codex-app-server-protocol = { path = "../../upstream/codex/codex-rs/app-server-protocol" }
codex-arg0 = { path = "../../upstream/codex/codex-rs/arg0" }
codex-config = { path = "../../upstream/codex/codex-rs/config" }
codex-core = { path = "../../upstream/codex/codex-rs/core" }
codex-exec-server = { path = "../../upstream/codex/codex-rs/exec-server" }
codex-feedback = { path = "../../upstream/codex/codex-rs/feedback" }
codex-protocol = { path = "../../upstream/codex/codex-rs/protocol" }
codex-utils-cli = { path = "../../upstream/codex/codex-rs/utils/cli" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
openssl-sys = { version = "0.9", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["std"] }

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"

[profile.dev-mobile]
inherits = "dev"
debug = 0
strip = "symbols"
incremental = false

[dev-dependencies]
tempfile = "3"

[workspace]
