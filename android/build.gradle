// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Resolve replaceable build outputs from the coordinator's dynamically selected local cache.
def nativeBuildOutput = System.getenv('CODEX_MOBILE_ANDROID_BUILD_DIR')
if (nativeBuildOutput) {
    allprojects { project ->
        project.layout.buildDirectory.set(new File(nativeBuildOutput, project.name))
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Select the installed build tools consistently for every Android module.
subprojects {
    afterEvaluate { project ->
        // Configure native Android modules after their platform extension is available.
        if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {
            project.android.buildToolsVersion = rootProject.ext.buildToolsVersion
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
